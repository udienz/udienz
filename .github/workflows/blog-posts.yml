name: Latest blog posts

on:
  schedule:
    - cron: "17 23 * * *" # setiap hari 06:17 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.udienz.web.id/feed.xml"
          max_post_count: 5
          date_format: "dd mmm yyyy"
          template: "- [$title]($url) <sub>· $date</sub>$newline"
          commit_message: "Update tulisan terbaru dari blog"
